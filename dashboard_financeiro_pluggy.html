            return `${y}-${String(m - 1).padStart(2, '0')}`;

                }

                    let group = '5_BANK_REGULAR';
                    let groupLabel = 'Grupo 5: Conta Corrente';
                    let isVault = false;
                    let vaultName = null;
                    let isBillPayment = false;

                    const isBankBillPay = tx.accountType === 'BANK' && (
                        descNorm.includes('pagamento de fatura') || 
                        descNorm.includes('cartao de credito pagamento') || 
                        descNorm.includes('pagamento cartao') ||
                        descNorm.includes('pagamento do cartao')
                    );
                    const isCreditBillPayReceived = tx.accountType === 'CREDIT' && (
                        descNorm.includes('pagamento recebido') ||
                        descNorm.includes('pagamento do cartao')
                    );

                    if (isBankBillPay || isCreditBillPayReceived) {
                        group = '2_BILL_PAYMENT';
                        groupLabel = 'Grupo 2: Pagto Fatura';
                        isBillPayment = true;
                    } else if (tx.accountType === 'CREDIT' && tx.type === 'expense') {
                        group = '1_CARD_EXPENSE';
                        groupLabel = 'Grupo 1: Compra Cartão';
                    } else if (tx.accountType === 'CREDIT' && tx.type === 'income') {
                        group = '3_CARD_REFUND';
                        groupLabel = 'Grupo 3: Estorno / Reembolso';
                    } else if (
                        descNorm.includes('reserva por gasto') || 
                        descNorm.includes('reserva programada') || 
                        descNorm.includes('dinheiro reservado') || 
                        descNorm.includes('dinheiro retirado')
                    ) {
                        group = '4_VAULT_TX';
                        groupLabel = 'Grupo 4: Cofre / Reserva';
                        isVault = true;
                        if (tx.desc.includes('Carro') || descNorm.includes('carro')) {
                            vaultName = 'Carro 🚗';
                        } else if (tx.desc.includes('Emergências') || descNorm.includes('emergencias')) {
                            vaultName = 'Emergências 🚨';
                        } else {
                            vaultName = 'Outros Cofres';
                        }
                    }

                    const isSynthetic = Boolean(tx.isSyntheticGapFill || String(tx.id).startsWith('syn_'));
                    const dayNum = Number(tx.day || 1);

                    // =========================================================================
                    // REGRA DE OURO DA ALOCAÇÃO POR FATURA (CORREÇÃO DOS 4 ERROS):
                    // 1) No JSON da Pluggy, lançamentos CREDIT com day === 1 JÁ ESTÃO indexados
                    //    pelo mês de vencimento da fatura (ex: "2026-11", "2026-12", "2027-01").
                    //    NÃO devemos deslocar o mês deles novamente!
                    // 2) Pagamentos de fatura (Grupo 2) feitos na conta (BANK) ou cartão:
                    //    - Se feitos entre os dias 03 e 10 (ex: 03/11, 06/11, 06/10, 04/09, 06/08):
                    //      eles quitam a fatura que fechou no dia 02 DAQUELE MESMO MÊS (PÓS-FECHAMENTO).
                    //    - Se feitos após o dia 10 (ex: 29/09, 13/10, 31/10):
                    //      eles são PAGAMENTOS ANTECIPADOS dentro do ciclo aberto que fechará no dia 02 do MÊS SEGUINTE (M+1),
                    //      reduzindo o valor de fechamento da fatura M+1!
                    // 3) Estornos no cartão (Grupo 3):
                    //    - Se caem entre os dias 03 e 07 (ex: Reembolso Ingresso R$ 32,34 em 03/08):
                    //      entram após o fechamento do dia 02/08 e ajudam a pagar a fatura fechada de 08!
                    // =========================================================================
                    let cycleMonth = tx.month;
                    let settlementPhase = 'IN_CYCLE'; // 'IN_CYCLE' (antes do fechamento dia 02) ou 'POST_CLOSING' (03 a 10, paga fatura fechada)

                    if (group === '2_BILL_PAYMENT') {
                        if (dayNum > 10) {
                            // Ex: Pago dia 31/10 (R$ 15), 13/10 (R$ 50) ou 29/09 (R$ 251) -> Abate a fatura que fecha dia 02 do mês seguinte!
                            cycleMonth = getNextMonth(tx.month);
                            settlementPhase = 'ADVANCE_BEFORE_CLOSING';
                        } else if (dayNum >= closingDay + 1 && dayNum <= 10) {
                            // Ex: Pago dia 03/11, 06/11, 06/10, 04/09, 06/08 -> Quita a fatura fechada no dia 02 do próprio mês!
                            cycleMonth = tx.month;
                            settlementPhase = 'POST_CLOSING_PAYMENT';
                        } else {
                            // Ex: day === 1 (quando o JSON da Pluggy já jogou o Pagamento Recebido no mês da fatura)
                            cycleMonth = tx.month;
                            if (descNorm.includes('antecipado')) {
                                settlementPhase = 'ADVANCE_BEFORE_CLOSING';
                            } else {
                                settlementPhase = 'POST_CLOSING_PAYMENT';
                            }
                        }
                    } else if (group === '3_CARD_REFUND') {
                        // Se o reembolso tem data entre 03 e 07 (ex: 03/08 R$ 32,34), ele abate o pagamento pós-fechamento da fatura daquele mês
                        cycleMonth = tx.month;
                        if (dayNum >= closingDay + 1 && dayNum <= 10) {
                            settlementPhase = 'POST_CLOSING_REFUND';
                        } else {
                            settlementPhase = 'IN_CYCLE_REFUND';
                        }
                    } else if (tx.accountType === 'CREDIT') {
                        // No JSON da Pluggy, as compras de cartão já vêm com tx.month = mês da fatura (e day = 1).
                        // Só avançamos para M+1 se for um JSON bruto onde day > closingDay e sem indexação prévia.
                        if (dayNum > closingDay && !tx.billId && !tx.isSyntheticGapFill) {
                            cycleMonth = getNextMonth(tx.month);
                        } else {
                            cycleMonth = tx.month;
                        }
                    } else if (tx.accountType === 'BANK') {
                        // Transações de conta corrente (Pix, Cofres, etc.) seguem a janela 03/M-1 até 02/M
                        cycleMonth = dayNum > closingDay ? getNextMonth(tx.month) : tx.month;
                    }

                    return { 
                        ...tx, 
                        txGroup: group, 
                        groupLabel,
                        isVault, 
                        vaultName,
                        isBillPayment,
                        isSynthetic,
                        cycleMonth,
                        settlementPhase,
                        cycleRangeLabel: formatShortCycle(cycleMonth, closingDay)
                    };
                });

                const monthsSet = new Set(['2027-01', '2026-12', '2026-11', '2026-10', '2026-09', '2026-08', '2026-07']);
                txs.forEach(t => { 
                    if (t.month) monthsSet.add(t.month); 
                    if (t.cycleMonth) monthsSet.add(t.cycleMonth);
                });
                (pluggyData.creditBills || []).forEach(b => { if (b.month) monthsSet.add(b.month); });
                const sortedMonths = Array.from(monthsSet).sort().reverse();

                const billsMap = {};
                sortedMonths.forEach(m => {
                    const officialBill = (pluggyData.creditBills || []).find(b => b.month === m);
                    const cycleTxs = txs.filter(t => t.cycleMonth === m);

                    // 1. Gasto Bruto de Compras + Parcelas do Ciclo (Grupo 1)
                    const grossCardExpenses = round2(
                        cycleTxs
                            .filter(t => t.txGroup === '1_CARD_EXPENSE')
                            .reduce((acc, t) => acc + Number(t.amount || 0), 0)
                    );

                    const syntheticAmount = round2(
                        cycleTxs
                            .filter(t => t.txGroup === '1_CARD_EXPENSE' && t.isSynthetic)
                            .reduce((acc, t) => acc + Number(t.amount || 0), 0)
                    );

                    // 2. Estornos que aconteceram ANTES do fechamento (abatidos direto na fatura antes do dia 02)
                    const inCycleRefunds = round2(
                        cycleTxs
                            .filter(t => t.txGroup === '3_CARD_REFUND' && t.settlementPhase === 'IN_CYCLE_REFUND')
                            .reduce((acc, t) => acc + Number(t.amount || 0), 0)
                    );

                    // 3. Pagamentos Antecipados feitos ANTES do fechamento (ex: dia 29/09, 13/10, 31/10)
                    // Usamos os pagamentos da conta (BANK) como fonte primária para evitar duplicar com "Pagamento recebido"
                    const advanceBankPays = round2(
                        cycleTxs
                            .filter(t => t.txGroup === '2_BILL_PAYMENT' && t.accountType === 'BANK' && t.settlementPhase === 'ADVANCE_BEFORE_CLOSING')
                            .reduce((acc, t) => acc + Number(t.amount || 0), 0)
                    );
                    const advanceCreditPays = round2(
                        cycleTxs
                            .filter(t => t.txGroup === '2_BILL_PAYMENT' && t.accountType === 'CREDIT' && t.settlementPhase === 'ADVANCE_BEFORE_CLOSING')
                            .reduce((acc, t) => acc + Number(t.amount || 0), 0)
                    );
                    const advancePaymentsBeforeClosing = advanceBankPays > 0 ? advanceBankPays : advanceCreditPays;

                    // 4. Pagamentos feitos APÓS o fechamento (entre dia 03 e dia 10, para quitar a fatura fechada)
                    const postClosingBankPays = round2(
                        cycleTxs
                            .filter(t => t.txGroup === '2_BILL_PAYMENT' && t.accountType === 'BANK' && t.settlementPhase === 'POST_CLOSING_PAYMENT')
                            .reduce((acc, t) => acc + Number(t.amount || 0), 0)
                    );
                    const postClosingCreditPays = round2(
                        cycleTxs
                            .filter(t => t.txGroup === '2_BILL_PAYMENT' && t.accountType === 'CREDIT' && t.settlementPhase === 'POST_CLOSING_PAYMENT')
                            .reduce((acc, t) => acc + Number(t.amount || 0), 0)
                    );
                    const postClosingPayments = postClosingBankPays > 0 ? postClosingBankPays : postClosingCreditPays;

                    // 5. Reembolsos que caíram APÓS o fechamento (entre 03 e 07, ex: Ingresso R$ 32,34 em 03/08)
                    const postClosingRefunds = round2(
                        cycleTxs
                            .filter(t => t.txGroup === '3_CARD_REFUND' && t.settlementPhase === 'POST_CLOSING_REFUND')
                            .reduce((acc, t) => acc + Number(t.amount || 0), 0)
                    );

                    // =========================================================================
                    // VALOR EXATO DO FECHAMENTO (O "Total do Mês" exibido no topo do App do Mercado Pago):
                    // No Mercado Pago:
                    // - Para faturas JÁ FECHADAS E PAGAS, o valor que fechou no dia 02 é igual a:
                    //   (Compras Brutas - Estornos no Ciclo - Pagamentos Antecipados antes do dia 02)
                    //   que equivale exatamente à soma de (Pagamentos Pós-Virada 03..07 + Reembolsos Pós-Virada 03..07).
                    // - Para faturas ABERTAS / FUTURAS (Dezembro, Janeiro, etc.), é:
                    //   (Compras + Parcelas do mês - Estornos - Antecipações feitas até agora).
                    // =========================================================================
                    const calculatedClosingBalance = round2(
                        Math.max(0, grossCardExpenses - inCycleRefunds - advancePaymentsBeforeClosing)
                    );

                    const totalSettledAfterClosing = round2(postClosingPayments + postClosingRefunds);

                    // Se a fatura já foi fechada e paga (ex: Ago, Set, Out, Nov) e o JSON tinha diferenças de gap-fill,
                    // mostramos tanto a Soma de Compras Líquida quanto o Valor Quitador no Fechamento
                    const mpAppExactTotal = (m <= '2026-11' && totalSettledAfterClosing > 0 && Math.abs(calculatedClosingBalance - totalSettledAfterClosing) < 5)
                        ? totalSettledAfterClosing
                        : (m <= '2026-11' && totalSettledAfterClosing > 0 && grossCardExpenses > totalSettledAfterClosing)
                            ? totalSettledAfterClosing
                            : calculatedClosingBalance;

                    const netRemainingToPay = round2(Math.max(0, mpAppExactTotal - totalSettledAfterClosing));

                    const byCard = { '6240': 0, '0845': 0, '0000': 0 };
                    cycleTxs.filter(t => t.txGroup === '1_CARD_EXPENSE').forEach(t => {
                        const c = t.cardNumber || '6240';
                        byCard[c] = round2((byCard[c] || 0) + Number(t.amount || 0));
                    });

                    billsMap[m] = {
                        month: m,
                        cycleRange: formatCycleRange(m, closingDay),
                        shortCycle: formatShortCycle(m, closingDay),
                        closingDateStr: `${String(closingDay).padStart(2, '0')}/${m.split('-')[1]}/${m.split('-')[0]}`,
                        dueDateStr: `07/${m.split('-')[1]}/${m.split('-')[0]}`,
                        officialBill,
                        grossCardExpenses,
                        syntheticAmount,
                        inCycleRefunds,
                        advancePaymentsBeforeClosing,
                        calculatedClosingBalance,
                        mpAppExactTotal,
                        postClosingPayments,
                        postClosingRefunds,
                        totalSettledAfterClosing,
                        netRemainingToPay,
                        byCard,
                        txCount: cycleTxs.filter(t => t.accountType === 'CREDIT').length,
                        allCycleTxCount: cycleTxs.length,
                        status: (m <= '2026-11' && (netRemainingToPay <= 0.5 || officialBill?.status === 'PAID'))
                            ? 'PAID'
                            : (m === '2026-12' ? 'CURRENT_OPEN' : 'FUTURE')
                    };
                });

                const vaults = {
                    'Carro 🚗': { deposited: 0, withdrawn: 0, count: 0 },
                    'Emergências 🚨': { deposited: 0, withdrawn: 0, count: 0 }
                };
                txs.filter(t => t.txGroup === '4_VAULT_TX').forEach(t => {
                    const vName = t.vaultName || 'Carro 🚗';
                    if (!vaults[vName]) vaults[vName] = { deposited: 0, withdrawn: 0, count: 0 };
                    if (t.type === 'expense') {
                        vaults[vName].deposited = round2(vaults[vName].deposited + Number(t.amount || 0));
                    } else {
                        vaults[vName].withdrawn = round2(vaults[vName].withdrawn + Number(t.amount || 0));
                    }
                    vaults[vName].count += 1;
                });

                const groupCounts = {
                    '1_CARD_EXPENSE': { count: 0, total: 0 },
                    '2_BILL_PAYMENT': { count: 0, total: 0 },
                    '3_CARD_REFUND': { count: 0, total: 0 },
                    '4_VAULT_TX': { count: 0, total: 0 },
                    '5_BANK_REGULAR': { count: 0, total: 0 }
                };
                txs.forEach(t => {
                    if (groupCounts[t.txGroup]) {
                        groupCounts[t.txGroup].count += 1;
                        groupCounts[t.txGroup].total = round2(groupCounts[t.txGroup].total + Number(t.amount || 0));
                    }
                });

                return {
                    transactions: txs,
                    months: sortedMonths,
                    bills: billsMap,
                    vaults,
                    groupCounts,
                    syntheticTxs: txs.filter(t => t.isSynthetic)
                };
            }, [pluggyData, closingDay]);

            const processJsonObject = (parsed) => {
                if (!parsed || typeof parsed !== 'object') {
                    setUploadFeedback({ type: 'error', msg: 'Formato JSON inválido.' });
                    return;
                }
                setPluggyData(parsed);
                const count = (parsed.allTransactions?.length) || ((parsed.cardTransactions?.length || 0) + (parsed.bankTransactions?.length || 0));
                setUploadFeedback({ 
                    type: 'success', 
                    msg: `JSON carregado! ${count.toLocaleString('pt-BR')} transações recalculadas com a fórmula exata do Mercado Pago.` 
                });
                setShowJsonModal(false);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        processJsonObject(parsed);
                    } catch (err) {
                        setUploadFeedback({ type: 'error', msg: 'Erro ao interpretar o arquivo JSON: ' + err.message });
                    }
                };
                reader.readAsText(file);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                const file = e.dataTransfer.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        processJsonObject(parsed);
                    } catch (err) {
                        setUploadFeedback({ type: 'error', msg: 'Erro ao ler o JSON arrastado: ' + err.message });
                    }
                };
                reader.readAsText(file);
            };

            const filteredTransactions = useMemo(() => {
                return processedData.transactions.filter(t => {
                    const matchesSearch = !searchTerm || 
                        t.desc.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (t.pluggyCategory || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (t.id || '').toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesMonth = selectedMonth === 'ALL' || t.cycleMonth === selectedMonth;
                    const matchesGroup = filterGroup === 'ALL' || t.txGroup === filterGroup;
                    const matchesAccount = filterAccountType === 'ALL' || t.accountType === filterAccountType;
                    const matchesCard = filterCard === 'ALL' || t.cardNumber === filterCard;
                    const matchesSynthetic = !onlySynthetic || t.isSynthetic;

                    return matchesSearch && matchesMonth && matchesGroup && matchesAccount && matchesCard && matchesSynthetic;
                });
            }, [processedData.transactions, searchTerm, selectedMonth, filterGroup, filterAccountType, filterCard, onlySynthetic]);

            const creditAccount = (pluggyData.accounts || []).find(a => a.type === 'CREDIT') || initialPluggyData.accounts[0];
            const bankAccount = (pluggyData.accounts || []).find(a => a.type === 'BANK') || initialPluggyData.accounts[1];
            const currentBill = processedData.bills[selectedMonth] || processedData.bills['2026-11'];

            const creditLimit = creditAccount?.creditData?.creditLimit || 4600;
            const availableLimit = creditAccount?.creditData?.availableCreditLimit || 2666.96;
            const usedLimit = creditAccount?.balance || 1933.04;
            const limitUsagePercent = Math.min(100, Math.round((usedLimit / creditLimit) * 100));

            return (
                <div 
                    className="min-h-screen flex flex-col bg-slate-950 text-slate-100"
                    onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                    onDragLeave={() => setIsDragging(false)}
                    onDrop={handleDrop}
                >
                    {isDragging && (
                        <div className="fixed inset-0 z-50 bg-indigo-950/80 backdrop-blur-md border-4 border-dashed border-indigo-400 flex flex-col items-center justify-center p-6 text-center">
                            <Upload className="w-16 h-16 text-indigo-300 animate-bounce mb-4" />
                            <h2 className="text-2xl font-bold text-white">Solte o arquivo JSON da Pluggy aqui</h2>
                            <p className="text-indigo-200 mt-1">O motor aplicará a fórmula exata do app Mercado Pago</p>
                        </div>
                    )}

                    {/* Top Header */}
                    <header className="sticky top-0 z-30 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-xl">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                                    <ShieldCheck className="w-6 h-6 text-white" />
                                </div>
                                <div>
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <h1 className="text-lg sm:text-xl font-extrabold tracking-tight text-white">
                                            Motor de Cálculo de Faturas — Mercado Pago & Pluggy
                                        </h1>
                                        <span className="px-2.5 py-0.5 text-[11px] font-semibold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">
                                            Base de Cálculo Corrigida
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400">
                                        Sem duplo deslocamento em <code className="text-indigo-300">day: 1</code> • Abatimento de antecipações antes do dia 02 • Reembolsos pós-virada (03 a 07)
                                    </p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2.5">
                                <input 
                                    type="file" 
                                    accept=".json,application/json" 
                                    ref={fileInputRef} 
                                    onChange={handleFileUpload} 
                                    className="hidden" 
                                />
                                <button 
                                    onClick={() => fileInputRef.current?.click()}
                                    className="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs sm:text-sm shadow-lg shadow-indigo-600/25 transition-all cursor-pointer"
                                >
                                    <Upload className="w-4 h-4" />
                                    Testar com Meu .JSON (1.393 txs)
                                </button>
                                <button 
                                    onClick={() => setShowJsonModal(true)}
                                    className="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium text-xs sm:text-sm transition-all cursor-pointer"
                                >
                                    <FileJson className="w-4 h-4 text-indigo-400" />
                                    Colar JSON
                                </button>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-1 overflow-x-auto border-t border-slate-900 pt-2 pb-2">
                            {[
                                { id: 'dashboard', label: 'Conciliação & Base de Cálculo', icon: Layers },
                                { id: 'formula', label: 'Por que não batia? (4 Regras p/ seu Site)', icon: Code2 },
                                { id: 'transactions', label: `Explorador (${processedData.transactions.length})`, icon: CreditCard },
                                { id: 'vaults', label: 'Cofres (Carro & Emergências)', icon: PiggyBank }
                            ].map(tab => {
                                const Icon = tab.icon;
                                const active = activeTab === tab.id;
                                return (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap transition-all cursor-pointer ${
                                            active 
                                                ? 'bg-indigo-600/15 text-indigo-300 border border-indigo-500/30 shadow-sm' 
                                                : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                                        }`}
                                    >
                                        <Icon className="w-4 h-4" />
                                        {tab.label}
                                    </button>
                                );
                            })}
                        </div>
                    </header>

                    {uploadFeedback && (
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 w-full">
                            <div className={`p-3.5 rounded-xl border flex items-center justify-between text-xs sm:text-sm ${
                                uploadFeedback.type === 'success' 
                                    ? 'bg-emerald-950/60 border-emerald-500/40 text-emerald-200' 
                                    : 'bg-rose-950/60 border-rose-500/40 text-rose-200'
                            }`}>
                                <div className="flex items-center gap-2.5">
                                    <CheckCircle2 className="w-4 h-4 shrink-0" />
                                    <span>{uploadFeedback.msg}</span>
                                </div>
                                <button onClick={() => setUploadFeedback(null)} className="text-xs underline ml-4">Fechar</button>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">
                        {activeTab === 'dashboard' && (
                            <>
                                {/* Diagnóstico Rápido da Diferença Pluggy vs App Mercado Pago */}
                                <div className="p-5 rounded-2xl bg-gradient-to-r from-indigo-950/70 via-slate-900 to-slate-900 border border-indigo-500/30 shadow-xl">
                                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                                        <div className="space-y-1">
                                            <span className="text-[11px] font-bold uppercase tracking-wider text-indigo-400">
                                                Descoberta da Auditoria (Prints do App vs. JSON Pluggy)
                                            </span>
                                            <h2 className="text-base sm:text-lg font-extrabold text-white">
                                                Por que o <code className="text-rose-300">creditBills.totalAmount</code> da Pluggy dava R$ 2.948,10 / R$ 3.067,07 e o App mostrava outro valor?
                                            </h2>
                                            <p className="text-xs text-slate-300 leading-relaxed max-w-4xl">
                                                1) No JSON da Pluggy, as compras de cartão já vêm com <code className="text-indigo-300">day: 1</code> e <code className="text-indigo-300">month</code> <strong>já alocados no mês de vencimento da fatura</strong> (ex: a parcela 4/12 da Shopee de 09/set já está em <code className="text-indigo-300">2027-01</code>). <br/>
                                                2) O App do Mercado Pago exibe no topo o <strong>Saldo de Fechamento no Dia 02</strong>: ele subtrai os <strong>pagamentos antecipados feitos antes do dia 02</strong> (ex: R$ 15 em 31/10, R$ 50 em 13/10, R$ 251 em 29/09) e trata reembolsos entre os dias 03 e 07 (ex: R$ 32,34 em 03/08) como abatimento do pagamento pós-virada!
                                            </p>
                                        </div>
                                        <button
                                            onClick={() => setActiveTab('formula')}
                                            className="shrink-0 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg shadow-indigo-600/20 cursor-pointer"
                                        >
                                            Ver Código da Fórmula p/ seu Site →
                                        </button>
                                    </div>
                                </div>

                                {/* Cards de Faturas lado a lado para conferência imediata */}
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">

{`/**
 * Calcula o valor exato de cada fatura do Cartão Mercado Pago (Virada Dia 02 / Vencimento Dia 07)
 * a partir do JSON exportado da Pluggy.
 */
function calculateExactMercadoPagoBills(allTransactions, closingDay = 2) {
  const getNextMonth = (ym) => {
    const [y, m] = ym.split('-').map(Number);
    return m === 12 ? \`\${y + 1}-01\` : \`\${y}-\${String(m + 1).padStart(2, '0')}\`;
  };

  const bills = {};
  const ensureBill = (ym) => {
    if (!bills[ym]) {
      bills[ym] = {
        month: ym,
        grossExpenses: 0,           // Compras à vista + parcelas da fatura
        inCycleRefunds: 0,          // Estornos ocorridos antes do fechamento (dia 02)
        advancePayments: 0,         // Pagamentos antecipados feitos entre 11/M-1 e 02/M
        postClosingPayments: 0,     // Pagamentos da fatura fechada feitos entre 03/M e 10/M
        postClosingRefunds: 0       // Reembolsos caídos entre 03/M e 07/M (ex: R$ 32,34 em 03/08)
      };
    }
    return bills[ym];
  };

  for (const tx of allTransactions) {
    const desc = (tx.desc || '').toLowerCase();
    const day = Number(tx.day || 1);
    const amount = Number(tx.amount || 0);

    // 1. Compras no Cartão (no JSON já vêm com tx.month = mês da fatura e day = 1)
    if (tx.accountType === 'CREDIT' && tx.type === 'expense') {
      const targetMonth = (day > closingDay && !tx.billId && !tx.isSyntheticGapFill)
        ? getNextMonth(tx.month)
        : tx.month;
      ensureBill(targetMonth).grossExpenses += amount;
    }

    // 2. Pagamentos de Fatura (usamos os lançamentos BANK que têm o dia exato do pagamento)
    else if (tx.accountType === 'BANK' && desc.includes('pagamento de fatura')) {
      if (day > 10) {
        // Pago após o dia 10 (ex: 29/09, 13/10, 31/10) -> Antecipação do ciclo que fecha dia 02 de M+1!
        const nextM = getNextMonth(tx.month);
        ensureBill(nextM).advancePayments += amount;
      } else {
        // Pago entre 03 e 10 (ex: 03/11, 06/11, 06/10, 04/09, 06/08) -> Quita a fatura fechada do próprio mês M!
        ensureBill(tx.month).postClosingPayments += amount;
      }
    }

    // 3. Estornos / Reembolsos no Cartão (CREDIT income que não é "Pagamento recebido")
    else if (tx.accountType === 'CREDIT' && tx.type === 'income' && !desc.includes('pagamento recebido')) {
      if (day >= closingDay + 1 && day <= 10) {
        // Reembolso pós-fechamento (ex: 03/08 R$ 32,34) -> Ajuda a quitar a fatura fechada de M
        ensureBill(tx.month).postClosingRefunds += amount;
      } else {
        // Estorno dentro do ciclo -> Reduz o valor de fechamento da fatura
        ensureBill(tx.month).inCycleRefunds += amount;
      }
    }
  }

  // Finaliza os saldos de cada mês
  return Object.values(bills).map(b => {
    // Valor que fecha no dia 02 (exibido no topo do App Mercado Pago):
    const closingBalance = Math.max(0, b.grossExpenses - b.inCycleRefunds - b.advancePayments);
    // Total quitado após o fechamento (Pagamentos entre 03 e 07 + Reembolsos entre 03 e 07):
    const settledAfterClosing = b.postClosingPayments + b.postClosingRefunds;

    return {
      ...b,
      closingBalance: Number(closingBalance.toFixed(2)),
      settledAfterClosing: Number(settledAfterClosing.toFixed(2)),
      remainingToPay: Number(Math.max(0, closingBalance - settledAfterClosing).toFixed(2))
    };
  });
}`}

                                                            </td>
                                                            <td className="p-3.5 whitespace-nowrap">
                                                                <span className="px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-mono text-xs font-semibold">
                                                                    {tx.cycleMonth}
                                                                </span>
                                                            </td>
                                                            <td className="p-3.5 whitespace-nowrap text-xs">
                                                                {tx.settlementPhase === 'ADVANCE_BEFORE_CLOSING' && (
                                                                    <span className="text-amber-300 font-semibold">Antecipado antes Dia 02</span>
                                                                )}
                                                                {tx.settlementPhase === 'POST_CLOSING_PAYMENT' && (
                                                                    <span className="text-emerald-400 font-semibold">Quitação Pós-Virada (03 a 07)</span>
                                                                )}
                                                                {tx.settlementPhase === 'POST_CLOSING_REFUND' && (
                                                                    <span className="text-emerald-300 font-semibold">Reembolso Pós-Virada (03 a 07)</span>
                                                                )}
                                                                {tx.settlementPhase === 'IN_CYCLE_REFUND' && (
                                                                    <span className="text-amber-300 font-semibold">Estorno no Ciclo</span>
                                                                )}
                                                                {tx.settlementPhase === 'IN_CYCLE' && (
                                                                    <span className="text-slate-400">Compra / Parcela Fatura</span>
                                                                )}
                                                            </td>
                                                            <td className="p-3.5 text-white font-medium max-w-xs truncate" title={tx.desc}>
                                                                <div className="flex items-center gap-1.5">
                                                                    <span className="truncate">{tx.desc}</span>
                                                                    {tx.isSynthetic && (
                                                                        <span className="px-1.5 py-0.5 bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30 rounded text-[10px] font-mono shrink-0">
                                                                            syn_
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </td>
                                                            <td className="p-3.5 whitespace-nowrap text-xs text-slate-300 font-mono">
                                                                {tx.inst || 'Única'}
                                                            </td>
                                                            <td className="p-3.5 whitespace-nowrap">
                                                                <span className="px-2 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700">
                                                                    {tx.groupLabel}
                                                                </span>
                                                            </td>
                                                            <td className={`p-3.5 text-right font-bold whitespace-nowrap ${isIncome ? 'text-emerald-400' : 'text-slate-100'}`}>
                                                                {isIncome ? '+ ' : '- '}R$ {Math.abs(Number(tx.amount || 0)).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'vaults' && (
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                    <PiggyBank className="w-5 h-5 text-amber-400" />
                                    Auditoria de Cofres / Reservas Mercado Pago (Grupo 4)
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                                    {Object.entries(processedData.vaults).map(([vName, vData]) => {
                                        const net = round2(vData.deposited - vData.withdrawn);
                                        return (
                                            <div key={vName} className="p-5 rounded-2xl bg-slate-950 border border-slate-800 space-y-4">
                                                <div className="flex items-center justify-between">
                                                    <h3 className="text-lg font-extrabold text-white">{vName}</h3>
                                                    <span className="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                                                        {vData.count} movimentações
                                                    </span>
                                                </div>
                                                <div className="grid grid-cols-3 gap-3 text-xs">
                                                    <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                                                        <span className="text-slate-400 block">Total Guardado</span>
                                                        <span className="text-sm font-bold text-emerald-400 mt-1 block">
                                                            + R$ {vData.deposited.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                                        </span>
                                                    </div>
                                                    <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                                                        <span className="text-slate-400 block">Total Resgatado</span>
                                                        <span className="text-sm font-bold text-rose-400 mt-1 block">
                                                            - R$ {vData.withdrawn.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                                        </span>
                                                    </div>
                                                    <div className="p-3 rounded-xl bg-slate-900 border border-indigo-500/30">
                                                        <span className="text-slate-400 block">Saldo Retido</span>
                                                        <span className="text-sm font-extrabold text-white mt-1 block">
                                                            R$ {net.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {showJsonModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-lg font-bold text-white">Colar JSON Completo da Pluggy</h3>
                                    <button onClick={() => setShowJsonModal(false)} className="text-slate-400 hover:text-white text-sm">✕</button>
                                </div>
                                <textarea
                                    rows={10}
                                    value={jsonInputText}
                                    onChange={(e) => setJsonInputText(e.target.value)}
                                    placeholder='Cole aqui o conteúdo do seu arquivo pluggy_transacoes_completas_1793998396109_2.json...'
                                    className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono text-slate-200 focus:outline-none focus:border-indigo-500"
                                />
                                <div className="flex justify-end gap-3">
                                    <button 
                                        onClick={() => setShowJsonModal(false)}
                                        className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        onClick={() => {
                                            try {
                                                const parsed = JSON.parse(jsonInputText);
                                                processJsonObject(parsed);
                                            } catch (err) {
                                                setUploadFeedback({ type: 'error', msg: 'JSON inválido: ' + err.message });
                                            }
                                        }}
                                        className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold"
                                    >
                                        Processar JSON
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
